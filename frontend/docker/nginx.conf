server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Use CoreDNS for runtime hostname resolution — prevents startup failure
    # when the backend service isn't ready yet.
    resolver 10.43.0.10 valid=10s;

    # WebSocket proxy — must set Upgrade/Connection headers for WS handshake
    location /ws {
        set $backend_upstream http://backend:3001;
        proxy_pass $backend_upstream/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # REST API proxy
    location /api/ {
        set $backend_upstream http://backend:3001;
        proxy_pass $backend_upstream/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA fallback — all non-asset routes serve index.html.
    location / {
        try_files $uri /index.html;
    }
}
