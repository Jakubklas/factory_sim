name: Build & push images

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io/jakubklas/factory_sim

jobs:
  simulator:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Set short SHA
        id: vars
        run: echo "sha=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
      - name: Build & push simulator
        uses: docker/build-push-action@v6
        with:
          context: .
          file: simulator/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/simulator:latest
            ${{ env.REGISTRY }}/simulator:main-${{ steps.vars.outputs.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/simulator:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/simulator:buildcache,mode=max

  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Set short SHA
        id: vars
        run: echo "sha=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/backend:latest
            ${{ env.REGISTRY }}/backend:main-${{ steps.vars.outputs.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/backend:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/backend:buildcache,mode=max

  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Set short SHA
        id: vars
        run: echo "sha=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/frontend:latest
            ${{ env.REGISTRY }}/frontend:main-${{ steps.vars.outputs.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/frontend:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/frontend:buildcache,mode=max
