# Simulator pods are no longer defined statically in Helm.
# The backend reconciler creates a Deployment + Service + PVC for each
# simulated PLC defined in the plant config (or DB when DATABASE_URL is set).
# See backend/src/k8s.rs for the reconcile loop.
#
# To provision sim pods:
#   1. Deploy the helm chart (backend + RBAC).
#   2. The backend creates sim pods on first reconcile (within 30s of startup).
#
# To add a new simulated PLC (file-based, Phase 5):
#   - Add the PLC to config/plant.json, redeploy backend image.
# To add a new simulated PLC (DB-based, Phase 6+):
#   - POST /api/plcs with kind=simulated; reconciler reacts within 30s.
