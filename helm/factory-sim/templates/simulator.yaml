{{- range .Values.plcs }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .id }}
  labels:
    app: {{ .id }}
    {{- include "factory-sim.labels" $ | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .id }}
  template:
    metadata:
      labels:
        app: {{ .id }}
    spec:
      nodeSelector:
        deploy_target: {{ .deployTarget }}
      containers:
      - name: simulator
        image: {{ $.Values.registry }}/simulator:{{ $.Values.imageTag }}
        env:
        - name: PLANT_CONFIG
          value: /config
        - name: SIM_PLC_ID
          value: {{ .id }}
        - name: SIM_TICK_MS
          value: "100"
        - name: OPCUA_HOST
          value: {{ .id }}
        - name: PKI_DIR
          value: /data/pki
        ports:
        - containerPort: {{ .port }}
        volumeMounts:
        - name: config
          mountPath: /config
          readOnly: true
        - name: data
          mountPath: /data
      volumes:
      - name: config
        configMap:
          name: plant-config
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .id }}
  labels:
    app: {{ .id }}
    {{- include "factory-sim.labels" $ | nindent 4 }}
spec:
  type: {{ .serviceType }}
  selector:
    app: {{ .id }}
  ports:
  - port: {{ .port }}
    targetPort: {{ .port }}
{{- end }}
