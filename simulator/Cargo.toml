[package]
name = "simulator"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "simulator"
path = "src/main.rs"

[dependencies]
plant_config = { path = "../plant_config" }
async-opcua = { version = "0.18", features = ["server"] }
async-trait = "0.1"
tokio = { version = "1.41", features = ["full"] }
axum = "0.7"
rhai = { version = "1", features = ["sync"] }
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = "0.4"
