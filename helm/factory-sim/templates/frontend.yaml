apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
    {{- include "factory-sim.labels" . | nindent 4 }}
  annotations:
    keel.sh/policy: glob
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 5m"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      nodeSelector:
        deploy_target: {{ .Values.frontend.deployTarget }}
      containers:
      - name: frontend
        image: {{ .Values.registry }}/frontend:{{ .Values.imageTag }}
        imagePullPolicy: Always
        env:
        - name: BE_URL
          value: {{ .Values.frontend.beUrl }}
        ports:
        - containerPort: 80
        volumeMounts:
        - name: nginx-conf
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: nginx.conf
      volumes:
      - name: nginx-conf
        configMap:
          name: plant-config
          items:
          - key: nginx.conf
            path: nginx.conf
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app: frontend
    {{- include "factory-sim.labels" . | nindent 4 }}
spec:
  type: LoadBalancer
  selector:
    app: frontend
  ports:
  - port: 8080
    targetPort: 80
