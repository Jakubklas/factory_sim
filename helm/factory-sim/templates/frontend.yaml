apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
    {{- include "factory-sim.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      nodeSelector:
        deploy_target: {{ .Values.frontend.deployTarget }}
      containers:
      - name: frontend
        image: {{ .Values.registry }}/frontend:{{ .Values.imageTag }}
        env:
        - name: BE_URL
          value: {{ .Values.frontend.beUrl }}
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app: frontend
    {{- include "factory-sim.labels" . | nindent 4 }}
spec:
  type: LoadBalancer
  selector:
    app: frontend
  ports:
  - port: 8080
    targetPort: 80
